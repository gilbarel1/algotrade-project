watchlist:
  # Original starter set (§1) — terms below are hand-tuned; do not change lightly.
  ["LUMI.TA"]
  # ,"LUMI.TA","POLI.TA","ESLT.TA",
  # Full TA-35 constituents (Wikipedia list, cross-checked vs TradingView 2026-07;
  # symbols are Yahoo/TASE *.TA). Expanding here is the design's intended scaling
  # point (§1: "the full list lives in config").
  # "OPCE.TA","ORA.TA","ICL.TA","AMOT.TA","ENLT.TA","BEZQ.TA","BIG.TA","FIBI.TA",
  # "DSCT.TA","DLEKG.TA","DIMRI.TA","PHOE.TA","HARL.TA","TSEM.TA","CLIS.TA",
  # "MVNE.TA","MGDL.TA","MZTF.TA","MLSR.TA","MMHD.TA","NVPT.TA","NVMI.TA",
  # "NWMD.TA","NXSN.TA","AZRG.TA","FTAL.TA","CAMT.TA","SAE.TA","STRS.TA","SPEN.TA"]
news_window_minutes: 4320
earnings_window_days: 5
# How many ranked disclosures the Earnings agent classifies per ticker (§3.2).
# The newest filing is usually administrative (a Form 4, a trading notice), so
# the top-ranked few are classified and the most material one is analyzed.
# Each candidate costs one classify call; only the winner is extracted from.
earnings_candidates: 3
ohlc_lookback_days: 180

# Ticker -> query terms used to fetch news (§3.1) AND to search Maya disclosures
# (§3.2, freeText search then local re-verify). Runs are unattended (schedule
# trigger over the fixed watchlist), so there is no user query: the ticker IS the
# query. But *.TA symbols are not searchable on NewsAPI/RSS/Maya ("TEVA.TA"
# matches no article text), so each ticker maps to the company's common name(s),
# incl. the Hebrew name for the HE feeds and the Hebrew Maya page. NewsAPI is
# searched by these terms; RSS feeds are pulled whole and filtered locally to
# items whose headline/summary contains a term (§4.3: not just tag metadata).
# Zero matches is a valid "no coverage" result (§13), distinct from a fetch
# failure. Prefer distinctive names over bare words (e.g. "Teva Pharmaceutical",
# not "Teva") to avoid mis-attribution.
#
# NOTE: entries flagged `# VERIFY` have a Hebrew name or *.TA symbol I could not
# fully confirm — spot-check before trusting their sentiment/earnings output. A
# wrong term degrades to thin/empty results (never fabrication, §13), so this is
# safe to run now and refine.
search_terms:
  # --- Original starter set (unchanged) ---
  # "Teva" alone collides with the Teva footwear brand (sandals/deals) in EN and
  # means "nature" in HE (also inside "מטבע"/currency), so distinctive company
  # names are used: "Teva Pharmaceutical" (EN) and "טבע תעשיות" (Teva Industries, HE).
  TEVA.TA: ["Teva Pharmaceutical", "טבע תעשיות"]
  NICE.TA: ["NICE Ltd", "NICE Systems"]
  LUMI.TA: ["Bank Leumi", "Leumi", "לאומי"]
  POLI.TA: ["Bank Hapoalim", "Hapoalim", "הפועלים"]
