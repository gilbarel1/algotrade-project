# RSS feeds fetched server-side by /news/fetch. EN feeds are primary; HE feeds
# are the §3.1 fallback (LLM translates inline). NewsAPI covers EN separately.
# URLs verified live 2026-07-05 (the previously-listed Calcalist feeds 404/403).
rss_feeds:
  en:
    # Globes English — general news feed (feed language: en).
    - "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=1725"
  he:
    # Ynet — כלכלה (economy).
    - "https://www.ynet.co.il/Integration/StoryRss6.xml"
    # Globes — שוק ההון והשקעות (capital markets & investments).
    - "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=585"
# n8n's Schedule Trigger cron is 6-field, SECONDS-FIRST: [sec] [min] [hour] [dom] [month] [dow].
# So "0 0 10-17 * * 0-4" = second 0, minute 0, hours 10-17, any day, any month, Sun-Thu (0=Sunday).
# A 5-field expression is misparsed (fields shift left; e.g. "0-4" lands in Month) and never fires.
# Timezone: n8n evaluates the cron in GENERIC_TIMEZONE (NOT TZ); set GENERIC_TIMEZONE=Asia/Jerusalem
# (§11.1) so 10-17 reads as local TASE hours. DST is handled by the timezone, not the expression.
# NOTE: design §4.4 shows the standard 5-field form "0 10-17 * * 0-4"; this is the n8n-correct 6-field
# equivalent of the same intent (see Step 10 deviation note). Covers TASE continuous trading ~09:30-17:25.
schedule_cron: "0 0 10-17 * * 0-4"
report_dir: "reports"

# n8n sub-workflow ids (§6.2, §4.4). Filled in after importing the agent workflows
# into n8n (Workflows -> the id in the editor URL). /costs/harvest uses these to
# attribute each agent sub-execution's LLM calls to an agent name in `costs` (§9.4),
# since n8n exposes token usage only through its execution API.
n8n_workflow_ids:
