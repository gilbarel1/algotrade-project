watchlist:
  # Original starter set (§1) — terms below are hand-tuned; do not change lightly.
  ["LUMI.TA"]
  # ,"LUMI.TA","POLI.TA","ESLT.TA",
  # Full TA-35 constituents (Wikipedia list, cross-checked vs TradingView 2026-07;
  # symbols are Yahoo/TASE *.TA). Expanding here is the design's intended scaling
  # point (§1: "the full list lives in config").
  # "OPCE.TA","ORA.TA","ICL.TA","AMOT.TA","ENLT.TA","BEZQ.TA","BIG.TA","FIBI.TA",
  # "DSCT.TA","DLEKG.TA","DIMRI.TA","PHOE.TA","HARL.TA","TSEM.TA","CLIS.TA",
  # "MVNE.TA","MGDL.TA","MZTF.TA","MLSR.TA","MMHD.TA","NVPT.TA","NVMI.TA",
  # "NWMD.TA","NXSN.TA","AZRG.TA","FTAL.TA","CAMT.TA","SAE.TA","STRS.TA","SPEN.TA"]
news_window_minutes: 4320
earnings_window_days: 5
# How many ranked disclosures the Earnings agent classifies per ticker (§3.2).
# The newest filing is usually administrative (a Form 4, a trading notice), so
# the top-ranked few are classified and the most material one is analyzed.
# Each candidate costs one classify call; only the winner is extracted from.
earnings_candidates: 3
ohlc_lookback_days: 180

# --- Market abstraction (§4.4) --------------------------------------------
# Every ticker resolves to exactly one market. Derivation: a `*.TA` suffix ⇒
# `tase`, any bare symbol ⇒ `us`; `market_overrides` below wins over the suffix
# rule when a symbol needs pinning explicitly. Each market bundles the properties
# that used to be global TASE assumptions, so a mixed watchlist
# (["TEVA.TA", "AAPL"]) is one list, not two code paths.
#
# TWO WEEKDAY CONVENTIONS live here, deliberately kept distinct:
#   * `closed_weekdays` uses PANDAS numbering (Mon=0 … Sun=6). Consumed by the
#     OHLC session-grid reindex in data/yahoo.py (§4.3).
#   * `trading_hours.days` uses the N8N CRON convention (0=Sun). Consumed by the
#     schedule gate in /runs/start (§6.1) and matches `schedule_cron` below.
# The conversion between them happens in exactly ONE place: is_market_open() in
# quant_service/data/markets.py. Do not "harmonise" these by hand.
#
# `open`/`close` are local wall-clock in the market's own `tz`; the gate computes
# "now" in that tz via zoneinfo, so the ~2-3 week Israel/US DST-skew windows are
# handled correctly (a fixed UTC offset would be wrong for part of the year).
markets:
  tase:
    closed_weekdays: [4, 5]          # Fri, Sat
    trading_hours:
      tz: "Asia/Jerusalem"
      days: [0, 1, 2, 3, 4]          # Sun-Thu
      open: "09:30"
      close: "17:25"                 # TASE continuous trading ends ~17:25
    earnings_source: maya
    rss_feed_groups: [en_il, he_il]  # keys into rss_feeds below
    currency: ILS
  us:
    closed_weekdays: [5, 6]          # Sat, Sun
    trading_hours:
      tz: "America/New_York"
      days: [1, 2, 3, 4, 5]          # Mon-Fri
      open: "09:30"
      close: "16:00"
    earnings_source: edgar           # SEC EDGAR (§4.1); wired up in Step 14
    rss_feed_groups: [en_us]
    currency: USD
    # Where /news/fetch gets search terms for a ticker that has no hand-tuned
    # `search_terms` entry below (§3.1). `sec_registry` derives them from the
    # SEC registrant name already cached by the EDGAR earnings path
    # ("NVIDIA CORP" -> "NVIDIA"). Without it, any S&P 500 name the config has
    # never seen gets no news, its Sentiment agent degrades, and §3.4 caps
    # conviction at medium — which matters because the chat assistant (§6.5)
    # accepts ad-hoc tickers from the whole index, not just the watchlist.
    # Omitted for `tase`: Israeli issuers are not SEC registrants, and their
    # Hebrew search terms cannot be derived from anywhere.
    search_terms_fallback: sec_registry
    # Publisher allowlist for the NewsAPI query (§3.1). NewsAPI searches the
    # whole web, and US brand names are ordinary words there: unrestricted,
    # "Google" returned a Go-language tutorial and a US-Iran story, "NVIDIA"
    # returned PyPI package listings. Restricting the PUBLISHER fixes that
    # without touching the query — measured 2026-07-21, "Alphabet OR Google"
    # went from 41 mixed items to 33 all-equity ones, and "NVIDIA" to 28.
    # (Narrowing the query wording instead was tried and reverted: NewsAPI then
    # requires a finance word in the title/description too, and "Apple Inc"
    # dropped to 0 items.)
    # `tase` deliberately has NO allowlist — Israeli coverage comes from Globes/
    # Ynet RSS plus NewsAPI on distinctive Hebrew/company terms, which is not
    # noisy, and an allowlist would silently exclude the Israeli press.
    newsapi_domains:
      - reuters.com
      - bloomberg.com
      - cnbc.com
      - marketwatch.com
      - finance.yahoo.com
      - seekingalpha.com
      - investing.com
      - fool.com
      - benzinga.com
      - barrons.com
      - thestreet.com
      - investors.com
      - zacks.com
      - biztoc.com
      - globenewswire.com
      - businesswire.com
      - prnewswire.com
      - ft.com
      - wsj.com
      - forbes.com

# Explicit symbol -> market pin, overriding the suffix rule. Empty by default;
# the suffix rule covers every symbol currently in use.
market_overrides: {}

# Ticker -> query terms used to fetch news (§3.1) AND to search Maya disclosures
# (§3.2, freeText search then local re-verify). Runs are unattended (schedule
# trigger over the fixed watchlist), so there is no user query: the ticker IS the
# query. But *.TA symbols are not searchable on NewsAPI/RSS/Maya ("TEVA.TA"
# matches no article text), so each ticker maps to the company's common name(s),
# incl. the Hebrew name for the HE feeds and the Hebrew Maya page. NewsAPI is
# searched by these terms; RSS feeds are pulled whole and filtered locally to
# items whose headline/summary contains a term (§4.3: not just tag metadata).
# Zero matches is a valid "no coverage" result (§13), distinct from a fetch
# failure. Prefer distinctive names over bare words (e.g. "Teva Pharmaceutical",
# not "Teva") to avoid mis-attribution.
#
# NOTE: entries flagged `# VERIFY` have a Hebrew name or *.TA symbol I could not
# fully confirm — spot-check before trusting their sentiment/earnings output. A
# wrong term degrades to thin/empty results (never fabrication, §13), so this is
# safe to run now and refine.
search_terms:
  # --- Original starter set (unchanged) ---
  # "Teva" alone collides with the Teva footwear brand (sandals/deals) in EN and
  # means "nature" in HE (also inside "מטבע"/currency), so distinctive company
  # names are used: "Teva Pharmaceutical" (EN) and "טבע תעשיות" (Teva Industries, HE).
  TEVA.TA: ["Teva Pharmaceutical", "טבע תעשיות"]
  NICE.TA: ["NICE Ltd", "NICE Systems"]
  LUMI.TA: ["Bank Leumi", "Leumi", "לאומי"]
  POLI.TA: ["Bank Hapoalim", "Hapoalim", "הפועלים"]
  ESLT.TA: ["Elbit Systems", "Elbit", "אלביט"]
  OPCE.TA:  ["OPC Energy", "או.פי.סי אנרגיה"]        # VERIFY Hebrew name
  ORA.TA:   ["Ormat Technologies", "Ormat", "אורמת"]
  ICL.TA:   ["ICL Group", "Israel Chemicals", "כיל"]
  AMOT.TA:  ["Amot Investments", "אמות השקעות"]
  ENLT.TA:  ["Enlight Renewable Energy", "Enlight Energy", "אנלייט"]
  BEZQ.TA:  ["Bezeq", "בזק"]
  BIG.TA:   ["BIG Shopping Centers", "ביג"]   # VERIFY "BIG" is collision-prone
  FIBI.TA:  ["First International Bank of Israel", "הבנק הבינלאומי"]
  DSCT.TA:  ["Israel Discount Bank", "Discount Bank", "בנק דיסקונט"]
  DLEKG.TA: ["Delek Group", "קבוצת דלק"]
  DIMRI.TA: ["Y.H. Dimri", "Dimri Construction", "י.ח. דמרי"]   # VERIFY Hebrew name
  PHOE.TA:  ["Phoenix Holdings", "Phoenix Financial", "הפניקס"]
  HARL.TA:  ["Harel Insurance", "Harel Group", "הראל"]
  TSEM.TA:  ["Tower Semiconductor", "טאואר סמיקונדקטור"]
  CLIS.TA:  ["Clal Insurance", "כלל ביטוח"]
  MVNE.TA:  ["Mivne Real Estate", "מבני תעשיה"]        # VERIFY symbol + Hebrew name
  MGDL.TA:  ["Migdal Insurance", "מגדל ביטוח"]
  MZTF.TA:  ["Mizrahi Tefahot", "Mizrahi-Tefahot Bank", "מזרחי טפחות"]
  MLSR.TA:  ["Melisron", "מליסרון"]
  MMHD.TA:  ["Menora Mivtachim", "מנורה מבטחים"]
  NVPT.TA:  ["Navitas Petroleum", "נאוויטס פטרוליום"]   # VERIFY Hebrew name
  NVMI.TA:  ["Nova Measuring Instruments", "Nova Ltd", "נובה"]   # VERIFY "Nova"/נובה collision-prone
  NWMD.TA:  ["NewMed Energy", "ניו-מד אנרגי"]           # VERIFY Hebrew name (ex-Delek Drilling)
  NXSN.TA:  ["NextVision Stabilized Systems", "NextVision", "נקסטויזן"]   # VERIFY Hebrew name
  AZRG.TA:  ["Azrieli Group", "קבוצת עזריאלי"]
  FTAL.TA:  ["Fattal Holdings", "מלונות פתאל"]
  CAMT.TA:  ["Camtek", "קמטק"]
  SAE.TA:   ["Shufersal", "שופרסל"]                     # VERIFY symbol (SAE is Shufersal's TASE ticker)
  STRS.TA:  ["Strauss Group", "שטראוס"]
  SPEN.TA:  ["Shapir Engineering", "שפיר הנדסה"]

  # --- US (market: us) ---
  # EN-only: the US feeds and NewsAPI carry no Hebrew. Same collision care as the
  # TASE names, and it bites harder here — terms are shared by the RSS path (which
  # only sees finance feeds) and NewsAPI (which searches the whole web).
  # Measured live 2026-07-20 over a 3-day window:
  #   ["Apple Inc","Apple"]  -> 43 items, 19 of them Pypi.org package listings
  #                             plus Slickdeals/Geeky Gadgets — near-useless for
  #                             financial sentiment.
  #   ["Apple Inc","iPhone"] -> 36 items, consumer/product coverage (deals, Siri
  #                             tips) rather than the equity.
  #   ["Apple Inc"]          ->  5 items, all equity news (Financial Post, MacDailyNews,
  #                             Biztoc on the quarter).
  # Fewer precise items beat many noisy ones: the sentiment agent scores what it is
  # given, and zero matches is a valid "no coverage" result (§13), not a failure.
  # Add further S&P 500 names here as the watchlist grows — verify each the same way.
  AAPL: ["Apple Inc"]

  # --- Brand != SEC registrant name (the class that MUST be curated) ---
  # A US ticker with no entry here falls back to the SEC registrant name
  # (`search_terms_fallback: sec_registry`, §3.1), which is correct for most of
  # the index: NVDA registers as "NVIDIA CORP", MSFT as "MICROSOFT CORP" — the
  # brand and the registration agree, so the derived term finds real coverage.
  #
  # It fails exactly where a company is REPORTED under a different name than it
  # REGISTERS under. GOOGL registers as "Alphabet Inc." and the derived term
  # "Alphabet" returned 0 articles over a 3-day window (measured live), because
  # the press writes "Google". That is not a thin-coverage result, it is the
  # wrong query — so these are hand-tuned, and hand-tuned always wins.
  #
  # Both forms are listed (OR-ed at query time) so the holding company and the
  # operating brand are both caught. The bare brand is safe here because these
  # are checked terms, not derived ones — but note "Meta" alone is not, since it
  # is an ordinary English prefix, hence "Meta Platforms" + "Facebook".
  GOOGL: ["Alphabet", "Google"]
  GOOG:  ["Alphabet", "Google"]
  META:  ["Meta Platforms", "Facebook"]

# RSS feeds fetched server-side by /news/fetch, keyed by FEED GROUP. A ticker's
# groups come from its market's `rss_feed_groups` (see `markets:` above), so a
# TASE name pulls en_il+he_il and a US name pulls en_us — no ticker ever pulls
# the other market's local press. NewsAPI covers EN separately for both markets.
#
# GROUP NAMING IS LOAD-BEARING: the part before the underscore is the feed's
# LANGUAGE (`en_il`/`en_us` -> en, `he_il` -> he) and routes FinBERT vs HeBERT
# downstream (§3.1); the part after is the region. routers/news.py derives the
# language by splitting on "_", so a new group must follow `<lang>_<region>`.
# IL URLs verified live 2026-07-05; US URLs verified live 2026-07-20.
rss_feeds:
  en_il:
    # Globes English — general news feed.
    - "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=1725"
  he_il:
    # Ynet — כלכלה (economy).
    - "https://www.ynet.co.il/Integration/StoryRss6.xml"
    # Globes — שוק ההון והשקעות (capital markets & investments).
    - "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=585"
  en_us:
    # Yahoo Finance — headline feed (broad US market coverage).
    - "https://finance.yahoo.com/news/rssindex"
    # CNBC — Finance.
    - "https://www.cnbc.com/id/10000664/device/rss/rss.html"
# n8n's Schedule Trigger cron is 6-field, SECONDS-FIRST: [sec] [min] [hour] [dom] [month] [dow].
# So "0 0 10-23 * * 0-5" = second 0, minute 0, hours 10-23, any day, any month, Sun-Fri (0=Sunday).
# A 5-field expression is misparsed (fields shift left; e.g. "0-5" lands in Month) and never fires.
# Timezone: n8n evaluates the cron in GENERIC_TIMEZONE (NOT TZ); set GENERIC_TIMEZONE=Asia/Jerusalem
# (§11.1) so the hours read as local Israeli time. DST is handled by the timezone, not the expression.
# NOTE: design §4.4 shows the standard 5-field form "0 10-23 * * 0-5"; this is the n8n-correct 6-field
# equivalent of the same intent.
#
# WIDENED IN STEP 13 (was "0 0 10-17 * * 0-4", TASE-only) to cover BOTH markets:
#   * TASE  09:30-17:25 Asia/Jerusalem      -> IL hours 10-17, Sun-Thu
#   * NYSE  09:30-16:00 America/New_York    -> IL hours 16:30-23:00 normally (IL is
#     7h ahead of ET), or 15:30-22:00 during the ~2-3 week IL/US DST-skew windows
#     when the gap is 6h. Both fit inside IL hours 10-23.
# Day-of-week 0-5 (Sun-Fri IL) covers TASE Sun-Thu plus NYSE Mon-Fri; a US Friday
# session ends Fri 23:00 IL at the latest and never crosses into Saturday.
#
# The cron is deliberately WIDER than either market. It is not the gate: the
# per-market gate lives in /runs/start (§6.1), which filters the watchlist to the
# markets actually in session and writes NO runs row when none is. A fire outside
# all market hours therefore costs one cheap HTTP call and changes nothing.
schedule_cron: "0 0 10-23 * * 0-5"
report_dir: "reports"

# n8n sub-workflow ids (§6.2, §4.4). /costs/harvest uses these to attribute each agent
# sub-execution's LLM calls to an agent name in `costs` (§9.4), since n8n exposes token
# usage only through its execution API.
#
# NORMALLY LEAVE THIS EMPTY. A workflow id is minted by the import, so it differs on
# every machine — committing one developer's ids makes the harvest 404 for everyone
# else, and `costs` stays empty while the run still looks green. /costs/harvest instead
# resolves ids at harvest time (§4.4), first hit wins:
#   1. N8N_WF_TECHNICAL / _SENTIMENT / _EARNINGS / _RISK_MANAGER / _CHAT in .env
#      (gitignored — pin your own ids without touching a tracked file).
#   2. Lookup by workflow NAME through the n8n API, keyed on the names in n8n/*.json.
#      A fresh import needs no configuration at all.
#   3. This block, as a last-resort default.
# Add an entry here only for a workflow renamed in n8n whose env var is unset.
n8n_workflow_ids: {}
