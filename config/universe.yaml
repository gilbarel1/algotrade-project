watchlist:
  # Original starter set (§1) — terms below are hand-tuned; do not change lightly.
  ["TEVA.TA","NICE.TA","LUMI.TA","POLI.TA","ESLT.TA",
  # Full TA-35 constituents (Wikipedia list, cross-checked vs TradingView 2026-07;
  # symbols are Yahoo/TASE *.TA). Expanding here is the design's intended scaling
  # point (§1: "the full list lives in config").
   "OPCE.TA","ORA.TA","ICL.TA","AMOT.TA","ENLT.TA","BEZQ.TA","BIG.TA","FIBI.TA",
   "DSCT.TA","DLEKG.TA","DIMRI.TA","PHOE.TA","HARL.TA","TSEM.TA","CLIS.TA",
   "MVNE.TA","MGDL.TA","MZTF.TA","MLSR.TA","MMHD.TA","NVPT.TA","NVMI.TA",
   "NWMD.TA","NXSN.TA","AZRG.TA","FTAL.TA","CAMT.TA","SAE.TA","STRS.TA","SPEN.TA"]
news_window_minutes: 120
earnings_window_days: 5
ohlc_lookback_days: 180

# Ticker -> query terms used to fetch news (§3.1) AND to search Maya disclosures
# (§3.2, freeText search then local re-verify). Runs are unattended (schedule
# trigger over the fixed watchlist), so there is no user query: the ticker IS the
# query. But *.TA symbols are not searchable on NewsAPI/RSS/Maya ("TEVA.TA"
# matches no article text), so each ticker maps to the company's common name(s),
# incl. the Hebrew name for the HE feeds and the Hebrew Maya page. NewsAPI is
# searched by these terms; RSS feeds are pulled whole and filtered locally to
# items whose headline/summary contains a term (§4.3: not just tag metadata).
# Zero matches is a valid "no coverage" result (§13), distinct from a fetch
# failure. Prefer distinctive names over bare words (e.g. "Teva Pharmaceutical",
# not "Teva") to avoid mis-attribution.
#
# NOTE: entries flagged `# VERIFY` have a Hebrew name or *.TA symbol I could not
# fully confirm — spot-check before trusting their sentiment/earnings output. A
# wrong term degrades to thin/empty results (never fabrication, §13), so this is
# safe to run now and refine.
search_terms:
  # --- Original starter set (unchanged) ---
  # "Teva" alone collides with the Teva footwear brand (sandals/deals) in EN and
  # means "nature" in HE (also inside "מטבע"/currency), so distinctive company
  # names are used: "Teva Pharmaceutical" (EN) and "טבע תעשיות" (Teva Industries, HE).
  TEVA.TA: ["Teva Pharmaceutical", "טבע תעשיות"]
  NICE.TA: ["NICE Ltd", "NICE Systems"]
  LUMI.TA: ["Bank Leumi", "Leumi", "לאומי"]
  POLI.TA: ["Bank Hapoalim", "Hapoalim", "הפועלים"]
  ESLT.TA: ["Elbit Systems", "Elbit", "אלביט"]

  # --- Remaining TA-35 constituents ---
  OPCE.TA:  ["OPC Energy", "או.פי.סי אנרגיה"]        # VERIFY Hebrew name
  ORA.TA:   ["Ormat Technologies", "Ormat", "אורמת"]
  ICL.TA:   ["ICL Group", "Israel Chemicals", "כיל"]
  AMOT.TA:  ["Amot Investments", "אמות השקעות"]
  ENLT.TA:  ["Enlight Renewable Energy", "Enlight Energy", "אנלייט"]
  BEZQ.TA:  ["Bezeq", "בזק"]
  BIG.TA:   ["BIG Shopping Centers", "ביג מרכזי קניות"]   # VERIFY "BIG" is collision-prone
  FIBI.TA:  ["First International Bank of Israel", "הבנק הבינלאומי"]
  DSCT.TA:  ["Israel Discount Bank", "Discount Bank", "בנק דיסקונט"]
  DLEKG.TA: ["Delek Group", "קבוצת דלק"]
  DIMRI.TA: ["Y.H. Dimri", "Dimri Construction", "י.ח. דמרי"]   # VERIFY Hebrew name
  PHOE.TA:  ["Phoenix Holdings", "Phoenix Financial", "הפניקס"]
  HARL.TA:  ["Harel Insurance", "Harel Group", "הראל"]
  TSEM.TA:  ["Tower Semiconductor", "טאואר סמיקונדקטור"]
  CLIS.TA:  ["Clal Insurance", "כלל ביטוח"]
  MVNE.TA:  ["Mivne Real Estate", "מבני תעשיה"]        # VERIFY symbol + Hebrew name
  MGDL.TA:  ["Migdal Insurance", "מגדל ביטוח"]
  MZTF.TA:  ["Mizrahi Tefahot", "Mizrahi-Tefahot Bank", "מזרחי טפחות"]
  MLSR.TA:  ["Melisron", "מליסרון"]
  MMHD.TA:  ["Menora Mivtachim", "מנורה מבטחים"]
  NVPT.TA:  ["Navitas Petroleum", "נאוויטס פטרוליום"]   # VERIFY Hebrew name
  NVMI.TA:  ["Nova Measuring Instruments", "Nova Ltd", "נובה"]   # VERIFY "Nova"/נובה collision-prone
  NWMD.TA:  ["NewMed Energy", "ניו-מד אנרגי"]           # VERIFY Hebrew name (ex-Delek Drilling)
  NXSN.TA:  ["NextVision Stabilized Systems", "NextVision", "נקסטויזן"]   # VERIFY Hebrew name
  AZRG.TA:  ["Azrieli Group", "קבוצת עזריאלי"]
  FTAL.TA:  ["Fattal Holdings", "מלונות פתאל"]
  CAMT.TA:  ["Camtek", "קמטק"]
  SAE.TA:   ["Shufersal", "שופרסל"]                     # VERIFY symbol (SAE is Shufersal's TASE ticker)
  STRS.TA:  ["Strauss Group", "שטראוס"]
  SPEN.TA:  ["Shapir Engineering", "שפיר הנדסה"]

# RSS feeds fetched server-side by /news/fetch. EN feeds are primary; HE feeds
# are the §3.1 fallback (LLM translates inline). NewsAPI covers EN separately.
# URLs verified live 2026-07-05 (the previously-listed Calcalist feeds 404/403).
rss_feeds:
  en:
    # Globes English — general news feed (feed language: en).
    - "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=1725"
  he:
    # Ynet — כלכלה (economy).
    - "https://www.ynet.co.il/Integration/StoryRss6.xml"
    # Globes — שוק ההון והשקעות (capital markets & investments).
    - "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=585"
# Cron is evaluated in n8n's TZ setting; set TZ=Asia/Jerusalem (§11.1) so this reads as local.
# Sun–Thu, hourly from 10:00 to 17:00 local time (covers TASE continuous trading ~09:30–17:25 IDT/IST).
# Day-of-week: 0=Sunday in n8n cron. DST is handled by the TZ setting, not the cron expression.
schedule_cron: "0 10-17 * * 0-4"
report_dir: "reports"
