name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Node is needed by tests/test_rubric_clamp.py, which executes the §3.4 clamp
      # straight out of the n8n workflow JSON rather than re-implementing it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # From requirements-dev.txt, never a copy pasted here: an inline list drifts the
      # moment a test imports a new module, which is how `feedparser` went missing on
      # the first run. That file is also what a developer installs to reproduce CI.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

      - name: Verify no secrets are committed
        run: |
          test ! -f .env || (echo "::error::.env must never be committed" && exit 1)
          echo "ok: .env is not tracked"
